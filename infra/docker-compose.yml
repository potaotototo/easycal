# Full EasyCal stack: Postgres, the API, the sync worker, and a one-shot migration
# job that the services wait for.
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#
# apps/web is not here — it deploys to Cloudflare Workers separately. Point it at
# this API with NEXT_PUBLIC_API_BASE_URL, and list its origin in WEB_ORIGINS.

name: easycal

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easycal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easycal}
      POSTGRES_DB: ${POSTGRES_DB:-easycal}
    ports:
      # Bound to loopback: the database should not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - easycal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easycal} -d ${POSTGRES_DB:-easycal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs migrations to completion, then exits. Both services wait on it, so a
  # deploy can never start against a schema that has not been migrated.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "node_modules/node-pg-migrate/bin/node-pg-migrate.mjs", "up", "-m", "migrations"]
    working_dir: /app/db
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-easycal}:${POSTGRES_PASSWORD:-easycal}@postgres:5432/${POSTGRES_DB:-easycal}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "apps/api/dist/index.js"]
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-easycal}:${POSTGRES_PASSWORD:-easycal}@postgres:5432/${POSTGRES_DB:-easycal}}
      API_PORT: ${API_PORT:-3000}
      WEB_ORIGINS: ${WEB_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "apps/worker/dist/index.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-easycal}:${POSTGRES_PASSWORD:-easycal}@postgres:5432/${POSTGRES_DB:-easycal}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SYNC_OVERLAP_HOURS: ${SYNC_OVERLAP_HOURS:-24}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CATEGORY_MODEL: ${OPENAI_CATEGORY_MODEL}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  easycal-pgdata:
