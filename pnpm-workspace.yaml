packages:
  - 'apps/*'
  - 'packages/*'
  - 'db'

# esbuild backs tsx and vitest; @embedded-postgres/* unpacks the Postgres binaries
# used by the local dev database. Entries for platforms nobody installs are ignored.
# bufferutil/utf-8-validate are optional native speedups for `ws` (a GramJS
# dependency) — the pure-JS paths are fine, so we skip the native toolchain.
# es5-ext's script only prints a funding banner.
# sharp/workerd/unrs-resolver are apps/web's image pipeline, Cloudflare runtime and
# eslint resolver — all legitimate build tooling.
allowBuilds:
  esbuild: true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  bufferutil: false
  'utf-8-validate': false
  'es5-ext': false
  sharp: true
  workerd: true
  'unrs-resolver': true
